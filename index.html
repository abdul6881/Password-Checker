<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataVault - Password Strength Analyzer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="checker-container">
        
        <div class="top-ribbon">
            <span><i class="fas fa-microchip"></i> DATA ANALYSIS ONLINE | SESSION INITIATED</span>
            <span class="ribbon-status"><i class="fas fa-clock"></i> ESTIMATE: PENDING INPUT</span>
        </div>

        <header class="header">
            <h1 class="main-title"><i class="fas fa-shield-alt"></i> DataVault</h1>
            <p class="tagline">Check your password safety and learn how to protect your accounts.</p>
        </header>
        
        <div class="input-section">
            <label for="password"><i class="fas fa-lock"></i> Enter Your Password</label>
            <div class="input-group">
                <input type="password" id="password" placeholder="Type your password here..." autocomplete="off">
                <button id="toggle-password" type="button" title="Toggle password visibility"><i class="fas fa-eye"></i></button>
            </div>
            
            <div class="strength-bar-group">
                <label><i class="fas fa-bolt"></i> Strength Indicator</label>
                <div class="power-container">
                    <div id="power-point"></div>
                </div>
            </div>
        </div>

        <div class="results-section" id="result-heading" style="display:none;">
            
            <div class="results-left-placeholder"></div>
            
            <div class="suggestions-box">
                <p id="suggestion"></p>
            </div>

            <div class="crack-time-box">
                <p id="crack-time"></p>
            </div>
        </div>
        
    </div>

    <script src="script.js"></script>
    <script>
        // JS to handle password visibility toggle
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Toggle the eye icon
            const icon = this.querySelector('i');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });
        
        // JAVASCRIPT TO UPDATE RIBBON STATUS (retained)
        const passwordInput = document.getElementById('password');
        const ribbonStatus = document.querySelector('.ribbon-status');

        passwordInput.addEventListener('input', function() {
            if (this.value.length > 0) {
                ribbonStatus.innerHTML = `<i class="fas fa-clock"></i> ESTIMATE: RUNNING...`;
            } else {
                 ribbonStatus.innerHTML = `<i class="fas fa-clock"></i> ESTIMATE: PENDING INPUT`;
            }
        });
    </script>
</body>
</html>
